name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check dependency lock
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run --frozen python -m unittest discover -s tests -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.6"
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check dependency lock
        run: uv lock --check

      - name: Sync coverage environment
        run: uv sync --frozen --all-extras --group dev

      - name: Run tests with branch coverage
        run: uv run --frozen --all-extras --group dev coverage run -m unittest discover -s tests

      - name: Publish coverage summary
        run: |
          uv run --frozen --all-extras --group dev coverage report | tee coverage.txt
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          uv run --frozen --all-extras --group dev coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.txt
            coverage.xml
          retention-days: 14

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.6"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check dependency lock
        run: uv lock --check

      - name: Build source and wheel distributions
        run: uv build --no-sources
